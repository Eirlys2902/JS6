<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS6</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            outline: 0;
            transition: all 0.2s ease;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-image: linear-gradient(linear, left top, right bottom, from(rgb(168, 148, 238)), to(rgb(248, 160, 223)));
            min-height: 100vh;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

                
        .cal {
            position: relative;
            width: 90%;
            max-width: 350px; 
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background-color: #ffffff;
        }

        .tog {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ffffff;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 30px;
            height: 30px;
        }
        .tog.active {
            color: #333333;
        }
        .tog::before {
            content: ' ';
            height: 35px;
            width: 35px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background-color: #333333;
            z-index: -1;
        }
        .tog.active::before {
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        #display {
            width: 100%;
            height: 150px;
            display: block; 
            text-align: right;
            line-height: 150px;
            font-size: 3rem;
            margin-bottom: 20px;
            overflow-x: auto;
            color: #0a1e23;
            white-space: nowrap;
            padding-right: 5px;
        }
        #display::-webkit-scrollbar {
            height: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            width: 25%;
            padding: 5px;
        }

        button {
            width: 100%;
            aspect-ratio: 1;
            border: 0;
            border-radius: 50%;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:active {
            transform: scale(0.9);
        }

        button#clear {
            background-color: #ffd5d8;
            color: #fc4552;
        }
        button.btn-n {
            background-color: #f0f3f7;
            color: #000;
        }
        button.btn-o {
            background-color: #ffd0fd;
            color: #f967f3;
        }
        button.btn-equal {
            background-color: #adf9e7;
            color: #000;
        }
        .cal.dark {
            background-color: #071115;
        }
        #display {
            color: #f8fafd;
        }
        button#clear {
            background-color: #2d191e;
            color: #bd3740;
        }
        button.btn-n {
            background-color: #1b2f38;
            color: #f8fafb;
        }
        button.btn-o {
            background-color: #2e1f39;
            color: #aa00a4;
        }
        button.btn-equal {
            background-color: #223323;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cal dark">
            <div class="tog active">
            </div>
            <div class="display-screen">
                <div id="display"></div>
            </div>
            <div class="buttons">
                <table>
                    <tr>
                        <td><button class="btn-o" id="clear" onclick="cls()">C</button></td>
                        <td><button class="btn-o" id="invert" onclick="inv()">+/-</button></td>
                        <td><button class="btn-o" id="backspace" onclick="del()">&#9003;</button></td>
                        <td><button class="btn-o" id="/" onclick="add('/')">&divide;</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn-n" id="7" onclick="add('7')">7</button></td>
                        <td><button class="btn-n" id="8" onclick="add('8')">8</button></td>
                        <td><button class="btn-n" id="9" onclick="add('9')">9</button></td>
                        <td><button class="btn-o" id="*" onclick="add('*')">&times;</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn-n" id="4" onclick="add('4')">4</button></td>
                        <td><button class="btn-n" id="5" onclick="add('5')">5</button></td>
                        <td><button class="btn-n" id="6" onclick="add('6')">6</button></td>
                        <td><button class="btn-o" id="-" onclick="add('-')">-</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn-n" id="1" onclick="add('1')">1</button></td>
                        <td><button class="btn-n" id="2" onclick="add('2')">2</button></td>
                        <td><button class="btn-n" id="3" onclick="add('3')">3</button></td>
                        <td><button class="btn-o" id="+" onclick="add('+')">+</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn-o" id="%" onclick="perc()">%</button></td>
                        <td><button class="btn-n" id="0" onclick="add('0')">0</button></td>
                        <td><button class="btn-n" id="." onclick="add('.')">.</button></td>
                        <td><button class="btn-equal" id="equal" onclick="calc()">=</button></td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script>
        const screen = document.querySelector('#display');

        function add(v) {
            screen.innerText += v;
            screen.scrollLeft = screen.scrollWidth;
        }

        function cls() {
            screen.innerText = '';
        }

        function del() {
            let val = screen.innerText;
            screen.innerText = val.slice(0, -1);
        }

        function check(v) {
            if (v === '') return false;
            if (v.includes('++') || v.includes('--') || v.includes('..') || v.includes('//')) return false;
            let last = v.slice(-1);
            if (['+', '-', '*', '/', '.'].includes(last)) return false;
            return true;
        }

        function calc() {
            let val = screen.innerText;
            if (check(val)) {
                let res = eval(val);
                if (isNaN(res) || !isFinite(res)) {
                    screen.innerText = 'Invalid';
                    setTimeout(cls, 1000);
                } else {
                    screen.innerText = res;
                    screen.scrollLeft = 0;
                }
            } else {
                if (val !== '') {
                    err();
                }
            }
        }

        function perc() {
            let val = screen.innerText;
            if (check(val)) {
                let res = eval(val) / 100;
                if (isNaN(res) || !isFinite(res)) {
                    screen.innerText = 'Invalid';
                    setTimeout(cls, 1000);
                } else {
                    screen.innerText = res;
                    screen.scrollLeft = 0;
                }
            } else {
                err();
            }
        }

        function inv() {
            let val = screen.innerText;
            if (val === '') {
                screen.innerText = '-';
                return;
            }
            let last = val.slice(-1);
            let prev = val.slice(-2, -1);
            let ops = ['+', '-', '*', '/'];

            if (last === '-' && (ops.includes(prev) || val.length === 1)) {
                screen.innerText = val.slice(0, -1);
                return;
            }
            if (ops.includes(last)) {
                screen.innerText += '-';
                screen.scrollLeft = screen.scrollWidth;
                return;
            }
            if (check(val)) {
                let res = eval(val) * -1;
                if (isNaN(res) || !isFinite(res)) {
                    screen.innerText = 'Invalid';
                    setTimeout(cls, 1000);
                } else {
                    screen.innerText = res;
                    screen.scrollLeft = 0;
                }
            }
        }

        function err() {
            screen.innerText = 'Error';
            setTimeout(cls, 1000);
        }

        const toggler = document.querySelector('.tog');
        const cal = document.querySelector('.cal');

        toggler.onclick = function() {
            cal.classList.toggle('dark');
            toggler.classList.toggle('active');
        }
    </script>
</body>
</html>
